KeyboardLayout = Раскладка клавіятуры
KeyboardLayoutTooltip = Што надрукавана на клавішах.
KeyboardType = Тып клавіятуры
KeyboardTypeTooltip = Форма вашай клавіятуры: плоскі Enter (ANSI) або высокі Enter з дадатковай клавішай злева ўнізе (ISO).
TypeAnsi = ANSI (ЗША) — плоскі Enter
TypeIso = ISO (Еўропа) — высокі Enter
HighlightHomeRow = Падсвечваць асноўны рад
HighlightHomeRowTooltip = Паказвае святлейшымі восем клавіш, на якіх ляжаць пальцы, каб знайсці іх адным позіркам. На дзвюх клавішах указальных пальцаў меткі бачныя заўсёды.
ScreenCentre = Цэнтр экрана
ScreenCentreTooltip = Якая частка клавіятуры знаходзіцца якраз у цэнтры экрана.
CentreWholeKeyboard = Уся клавіятура
CentreSpaceBar = Прабел
CentreBetweenIndexFingers = Паміж указальнымі пальцамі
ShowJudgements = Паказваць ацэнкі пападанняў
ShowJudgementsTooltip = Паказвае Great, Ok, Meh і Miss дробна пад літарай націснутай клавішы, графікай вашага скіна.
AppliesNextMap = Дзейнічае з наступнай карты.
KeySpace = Прабел
HoldSpace = Трымайце прабел!
KeyBindingsHint = Калі ласка, не змяняйце гэтыя прызначэнні без патрэбы. Калі клавіятура не падыходзіць, выберыце яе ў наладах keybosu!.
ModOriginalDensityDescription = Усе ноты карты, на ўсіх клавішах, са сваім approach rate.
ModEasyDescription = Шырэйшыя вокны таймінгу, квадраты, што запаўняюцца павольней, мякчэйшая страта здароўя і дадатковыя жыцці!
ModHiddenDescription = Ноты знікаюць, пакуль іх квадрат яшчэ не запоўнены: націскай іх па памяці.
ModMirrorDescription = Адлюстроўвае карту злева направа: ноты з левага боку трапляюць на правы бок клавіятуры.
ModLeftHandDescription = Усе ноты трапляюць на левую палову клавіятуры, толькі для левай рукі.
ModRightHandDescription = Усе ноты трапляюць на правую палову клавіятуры, толькі для правай рукі.
ModHomeRowDescription = Усе ноты трапляюць на асноўны рад: восем клавіш, на якіх ляжаць пальцы.
Feedback = Водгукі і паведамленні пра памылкі на GitHub
