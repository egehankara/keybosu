KeyboardLayout = 鍵盤配置
KeyboardLayoutTooltip = 鍵帽上印的字元。
KeyboardType = 鍵盤類型
KeyboardTypeTooltip = 你的鍵盤形狀：扁平 Enter 鍵（ANSI），或在 Z 左邊多一個鍵的直長 Enter 鍵（ISO）。
TypeAnsi = ANSI（美式）- 扁平 Enter 鍵
TypeIso = ISO（歐式）- 直長 Enter 鍵
HighlightHomeRow = 突顯基準鍵
HighlightHomeRowTooltip = 用較淺的顏色顯示手指放置的八個鍵，讓你一眼就能找到。兩個食指鍵上始終顯示凸點。
ScreenCentre = 螢幕中心
ScreenCentreTooltip = 鍵盤的哪一部分位於螢幕正中央。
CentreWholeKeyboard = 整個鍵盤
CentreSpaceBar = 空白鍵
CentreBetweenIndexFingers = 兩根食指之間
ShowJudgements = 顯示判定
ShowJudgementsTooltip = 在所按鍵的字母下方以小字顯示 Great、Ok、Meh 和 Miss，使用你面板自帶的圖像。
AppliesNextMap = 從下一張圖譜開始生效。
KeySpace = 空白
HoldSpace = 按住空白鍵！
KeyBindingsHint = 除非必要，請不要更改這些按鍵綁定。如果鍵盤不符，可以在 keybosu! 的設定中選擇。
ModOriginalDensityDescription = 圖譜的所有音符，出現在所有按鍵上，並保持各自的縮圈速度。
Feedback = 在 GitHub 上回饋和回報問題
