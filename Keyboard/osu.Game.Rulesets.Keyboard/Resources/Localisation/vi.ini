ShowJudgements=Hiện đánh giá
ShowJudgementsTooltip=Hiện Great, Ok, Meh và Miss nhỏ bên dưới chữ của phím bạn nhấn, dùng hình ảnh của skin bạn.
AppliesNextMap=Áp dụng từ map tiếp theo.
KeySpace=Phím cách
HoldSpace=Giữ phím cách!
