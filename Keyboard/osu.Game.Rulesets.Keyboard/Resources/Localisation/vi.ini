ModOriginalDensityDescription = Mọi nốt của map, trên mọi phím, với approach rate riêng của nó.
ModEasyDescription = Cửa sổ timing rộng hơn, ô vuông đầy chậm hơn, mất máu nhẹ hơn và thêm mạng!
ModHiddenDescription = Nốt mờ dần trước khi ô vuông đầy: hãy bấm theo trí nhớ.
ModMirrorDescription = Lật map từ trái sang phải: nốt bên trái rơi vào bên phải bàn phím.
ModLeftHandDescription = Mọi nốt đều nằm ở nửa trái bàn phím, chỉ dành cho tay trái.
ModRightHandDescription = Mọi nốt đều nằm ở nửa phải bàn phím, chỉ dành cho tay phải.
ModHomeRowDescription = Mọi nốt đều nằm ở hàng phím cơ sở: tám phím mà các ngón tay bạn đặt lên.
Feedback = Góp ý và báo lỗi trên GitHub
