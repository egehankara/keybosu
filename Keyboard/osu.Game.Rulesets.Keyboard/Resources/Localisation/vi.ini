ShowJudgementsTooltip = Hiện Great, Ok, Meh và Miss nhỏ bên dưới chữ của phím bạn nhấn, dùng hình ảnh của skin bạn.
ShowFollowPoints = Hiện follow point
ShowFollowPointsTooltip = Hiện các điểm dẫn từ mỗi nốt đến nốt tiếp theo, giống như trong osu!. Chúng thay đổi theo skin của bạn.
AppliesNextMap = Áp dụng từ map tiếp theo.
KeySpace = Phím cách
HoldSpace = Giữ phím cách!
