; English source texts for keybosu!. Every other <language>.ini in this folder translates these keys.
; Translations are managed on Crowdin; edit only this file by hand, the others come back from Crowdin.
; Tooltips get AppliesNextMap appended automatically.

KeyboardLayout=Disposition du clavier
KeyboardLayoutTooltip=Ce qui est imprimé sur les touches.
KeyboardType=Type de clavier
KeyboardTypeTooltip=La forme de votre clavier : Entrée plate (ANSI) ou Entrée haute avec une touche en plus en bas à gauche (ISO).
TypeAnsi=ANSI (US) - Entrée plate
TypeIso=ISO (Europe) - Entrée haute
HighlightHomeRow=Mettre en évidence la rangée de repos
HighlightHomeRowTooltip=Affiche dans une couleur plus claire les huit touches où reposent vos doigts, pour les repérer d'un coup d'œil. Les deux touches des index gardent toujours leur repère.
ScreenCentre=Centre de l'écran
ScreenCentreTooltip=Quelle partie du clavier se trouve exactement au centre de l'écran.
CentreWholeKeyboard=Tout le clavier
CentreSpaceBar=Barre d'espace
CentreBetweenIndexFingers=Entre les index
ShowJudgements=Afficher les jugements
ShowJudgementsTooltip=Affiche Great, Ok, Meh et Miss en petit sous la lettre de la touche frappée, avec les graphismes de votre skin.
ShowFollowPoints=Show follow points
ShowFollowPointsTooltip=Shows the points that lead from each note to the next, as in osu!. They follow your skin.
AppliesNextMap=S'applique au début de la prochaine map.
KeySpace=Espace
HoldSpace=Maintenez Espace !
KeyBindingsHint=Merci de ne modifier ces raccourcis qu'en cas de nécessité. Si votre clavier ne correspond pas, choisissez-le dans les options de keybosu!.
ModOriginalDensityDescription=Toutes les notes de la map, sur toutes les touches, avec leur propre approach rate.
ModEasyDescription=Wider timing windows, slower filling squares, more forgiving health drain and extra lives!
ModHiddenDescription=Notes fade out before their square is full, so press them from memory.
ModMirrorDescription=Flips the map left to right: notes from the left side land on the right side of the keyboard.
ModLeftHandDescription=Every note lands on the left half of the keyboard, for the left hand only.
ModRightHandDescription=Every note lands on the right half of the keyboard, for the right hand only.
ModHomeRowDescription=Every note lands on the home row: the eight keys your fingers rest on.
Feedback=Avis et signalement de bugs sur GitHub

