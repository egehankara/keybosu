# English source texts for keybosu!. Every other <language>.ini in this folder translates these keys.=
# Translations are managed on Crowdin; edit only this file by hand, the others come back from Crowdin.=
# Tooltips get AppliesNextMap appended automatically.=

KeyboardLayout=Раскладка клавиатуры
KeyboardLayoutTooltip=Что напечатано на клавишах.
KeyboardType=Тип клавиатуры
KeyboardTypeTooltip=Форма клавиатуры: плоский Enter (ANSI) или высокий Enter с дополнительной клавишей слева внизу (ISO).
TypeAnsi=ANSI (США) — плоский Enter
TypeIso=ISO (Европа) — высокий Enter
HighlightHomeRow=Подсвечивать основной ряд
