ScreenCentre=Центр экрана
ScreenCentreTooltip=Какая часть клавиатуры находится точно в центре экрана.
CentreWholeKeyboard=Вся клавиатура
CentreSpaceBar=Пробел
CentreBetweenIndexFingers=Между указательными пальцами
ShowJudgements=Показывать оценки попаданий
ShowJudgementsTooltip=Показывает Great, Ok, Meh и Miss мелко под буквой нажатой клавиши, графикой вашего скина.
AppliesNextMap=Применяется со следующей карты.
KeySpace=Пробел
HoldSpace=Держите пробел!
KeyBindingsHint=Пожалуйста, не меняйте эти назначения без необходимости. Если клавиатура не подходит, выберите её в настройках keybosu!.
Feedback=Отзывы и сообщения об ошибках на GitHub

