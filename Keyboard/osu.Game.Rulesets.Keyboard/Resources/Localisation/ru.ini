; English source texts for keybosu!. Every other <language>.ini in this folder translates these keys.
; Translations are managed on Crowdin; edit only this file by hand, the others come back from Crowdin.
; Tooltips get AppliesNextMap appended automatically.

KeyboardLayout=Раскладка клавиатуры
KeyboardLayoutTooltip=Что напечатано на клавишах.
KeyboardType=Тип клавиатуры
KeyboardTypeTooltip=Форма клавиатуры: плоский Enter (ANSI) или высокий Enter с дополнительной клавишей слева внизу (ISO).
TypeAnsi=ANSI (США) — плоский Enter
TypeIso=ISO (Европа) — высокий Enter
HighlightHomeRow=Подсвечивать основной ряд
HighlightHomeRowTooltip=Показывает светлее восемь клавиш, на которых лежат пальцы, чтобы найти их одним взглядом. На двух клавишах указательных пальцев метки видны всегда.
ScreenCentre=Центр экрана
ScreenCentreTooltip=Какая часть клавиатуры находится точно в центре экрана.
CentreWholeKeyboard=Вся клавиатура
CentreSpaceBar=Пробел
CentreBetweenIndexFingers=Между указательными пальцами
ShowJudgements=Показывать оценки попаданий
ShowJudgementsTooltip=Показывает Great, Ok, Meh и Miss мелко под буквой нажатой клавиши, графикой вашего скина.
ShowFollowPoints=Показывать follow points
ShowFollowPointsTooltip=Показывает точки, ведущие от каждой ноты к следующей, как в osu!. Они зависят от твоего скина.
AppliesNextMap=Применяется со следующей карты.
KeySpace=Пробел
HoldSpace=Держите пробел!
KeyBindingsHint=Пожалуйста, не меняйте эти назначения без необходимости. Если клавиатура не подходит, выберите её в настройках keybosu!.
ModOriginalDensityDescription=Все ноты карты, на всех клавишах, со своим approach rate.
ModEasyDescription=Более широкие окна тайминга, медленнее заполняющиеся квадраты, щадящая потеря здоровья и дополнительные жизни!
ModHiddenDescription=Ноты исчезают, пока их квадрат ещё не заполнен: нажимай их по памяти.
ModMirrorDescription=Отражает карту слева направо: ноты с левой стороны попадают на правую сторону клавиатуры.
ModLeftHandDescription=Все ноты попадают на левую половину клавиатуры, только для левой руки.
ModRightHandDescription=Все ноты попадают на правую половину клавиатуры, только для правой руки.
ModHomeRowDescription=Все ноты попадают на основной ряд: восемь клавиш, на которых лежат пальцы.
Feedback=Отзывы и сообщения об ошибках на GitHub

