; English source texts for keybosu!. Every other <language>.ini in this folder translates these keys.
; Translations are managed on Crowdin; edit only this file by hand, the others come back from Crowdin.
; Tooltips get AppliesNextMap appended automatically.

KeyboardLayout=键盘布局
KeyboardLayoutTooltip=键帽上印的字符。
KeyboardType=键盘类型
KeyboardTypeTooltip=你的键盘形状：扁平回车键（ANSI），或在 Z 左边多一个键的竖长回车键（ISO）。
TypeAnsi=ANSI（美式）- 扁平回车键
TypeIso=ISO（欧式）- 竖长回车键
HighlightHomeRow=突出显示基准键
HighlightHomeRowTooltip=用更浅的颜色显示手指放置的八个键，让你一眼就能找到。两个食指键上始终显示凸点。
ScreenCentre=屏幕中心
ScreenCentreTooltip=键盘的哪一部分位于屏幕正中央。
CentreWholeKeyboard=整个键盘
CentreSpaceBar=空格键
CentreBetweenIndexFingers=两根食指之间
ShowJudgements=显示判定
ShowJudgementsTooltip=在所按键的字母下方以小字显示 Great、Ok、Meh 和 Miss，使用你皮肤自带的图像。
AppliesNextMap=从下一张谱面开始生效。
KeySpace=空格
HoldSpace=按住空格键！
KeyBindingsHint=除非必要，请不要更改这些按键绑定。如果键盘不匹配，可以在 keybosu! 的设置中选择。
ModOriginalDensityDescription=谱面的所有音符，出现在所有按键上，并保持各自的缩圈速度。
Feedback=在 GitHub 上反馈和报告问题

