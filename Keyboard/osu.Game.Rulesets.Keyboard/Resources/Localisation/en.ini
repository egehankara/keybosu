; English source texts for keybosu!. Every other <language>.ini in this folder translates these keys.
; Translations are managed on Crowdin; edit only this file by hand, the others come back from Crowdin.
; Tooltips get AppliesNextMap appended automatically.

KeyboardLayout = Keyboard layout
KeyboardLayoutTooltip = What is printed on the keys.
KeyboardType = Keyboard type
KeyboardTypeTooltip = The shape of your keyboard: flat Enter (ANSI) or tall Enter with an extra key left of Z (ISO).
TypeAnsi = ANSI (US) - flat Enter
TypeIso = ISO (Europe) - tall Enter
HighlightHomeRow = Highlight home row keys
HighlightHomeRowTooltip = Gives the eight keys your fingers rest on a lighter colour, so you find them at a glance. The two index-finger keys always show their bumps.
ScreenCentre = Screen centre
ScreenCentreTooltip = Which part of the keyboard sits exactly in the middle of the screen.
CentreWholeKeyboard = Whole keyboard
CentreSpaceBar = Space bar
CentreBetweenIndexFingers = Between the index fingers
ShowJudgements = Show judgements
ShowJudgementsTooltip = Shows Great, Ok, Meh and Miss small under the letter of the key you hit, using your skin's own graphics.
AppliesNextMap = Applies the next time a map starts.
KeySpace = Space
HoldSpace = Hold Space!
KeyBindingsHint = Please don't change these bindings unless you have to. If your keyboard doesn't match, choose it in keybosu!'s own settings.
ModOriginalDensityDescription = Every note of the map, on every key, at its own approach rate.
ModEasyDescription = Wider timing windows, slower filling squares, more forgiving health drain and extra lives!
ModHiddenDescription = Notes fade out before their square is full, so press them from memory.
ModMirrorDescription = Flips the map left to right: notes from the left side land on the right side of the keyboard.
ModLeftHandDescription = Every note lands on the left half of the keyboard, for the left hand only.
ModRightHandDescription = Every note lands on the right half of the keyboard, for the right hand only.
ModHomeRowDescription = Every note lands on the home row: the eight keys your fingers rest on.
Feedback = Feedback and bug reports on GitHub
