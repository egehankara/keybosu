; English source texts for keybosu!. Every other <language>.ini in this folder translates these keys.
; Translations are managed on Crowdin; edit only this file by hand, the others come back from Crowdin.
; Tooltips get AppliesNextMap appended automatically.

KeyboardLayout=키보드 배열
KeyboardLayoutTooltip=키에 인쇄된 글자입니다.
KeyboardType=키보드 종류
KeyboardTypeTooltip=키보드의 모양: 납작한 Enter(ANSI) 또는 Z 왼쪽에 키가 하나 더 있는 세로로 긴 Enter(ISO).
TypeAnsi=ANSI (미국) - 납작한 Enter
TypeIso=ISO (유럽) - 세로로 긴 Enter
HighlightHomeRow=기본 자리 강조
HighlightHomeRowTooltip=손가락을 올려두는 여덟 개의 키를 더 밝은 색으로 표시해 한눈에 찾을 수 있게 합니다. 두 검지 키에는 돌기가 항상 표시됩니다.
ScreenCentre=화면 중앙
ScreenCentreTooltip=키보드의 어느 부분을 화면 정중앙에 둘지 정합니다.
CentreWholeKeyboard=키보드 전체
CentreSpaceBar=스페이스 바
CentreBetweenIndexFingers=두 검지 사이
ShowJudgements=판정 표시
ShowJudgementsTooltip=누른 키의 글자 아래에 Great, Ok, Meh, Miss를 작게 표시합니다. 스킨의 판정 이미지를 사용합니다.
ShowFollowPoints=팔로우 포인트 표시
ShowFollowPointsTooltip=osu!처럼 각 노트에서 다음 노트로 이어지는 점을 표시합니다. 스킨에 따라 바뀝니다.
AppliesNextMap=다음 맵부터 적용됩니다.
KeySpace=스페이스
HoldSpace=스페이스를 누르고 있으세요!
KeyBindingsHint=꼭 필요한 경우가 아니면 이 키 설정을 변경하지 마세요. 키보드가 맞지 않으면 keybosu! 설정에서 선택할 수 있습니다.
ModOriginalDensityDescription=맵의 모든 노트를 모든 키에서 원래의 어프로치 레이트로.
ModEasyDescription=판정 범위가 넓어지고, 사각형이 천천히 차고, 체력이 덜 깎이며, 추가 목숨이 생깁니다!
ModHiddenDescription=사각형이 다 차기 전에 노트가 사라집니다. 기억에 의지해 누르세요.
ModMirrorDescription=맵을 좌우로 뒤집습니다. 왼쪽의 노트가 키보드 오른쪽에 나옵니다.
ModLeftHandDescription=모든 노트가 키보드 왼쪽 절반에 나옵니다. 왼손 전용입니다.
ModRightHandDescription=모든 노트가 키보드 오른쪽 절반에 나옵니다. 오른손 전용입니다.
ModHomeRowDescription=모든 노트가 손가락을 올려 두는 기본 자리 8개 키에 나옵니다.
Feedback=GitHub에서 의견 및 버그 제보

