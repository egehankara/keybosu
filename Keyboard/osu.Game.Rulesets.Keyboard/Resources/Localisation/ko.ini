AppliesNextMap=다음 맵부터 적용됩니다.
KeySpace=스페이스
HoldSpace=스페이스를 누르고 있으세요!
KeyBindingsHint=꼭 필요한 경우가 아니면 이 키 설정을 변경하지 마세요. 키보드가 맞지 않으면 keybosu! 설정에서 선택할 수 있습니다.
Feedback=GitHub에서 의견 및 버그 제보

