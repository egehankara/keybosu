; English source texts for keybosu!. Every other <language>.ini in this folder translates these keys.
; Translations are managed on Crowdin; edit only this file by hand, the others come back from Crowdin.
; Tooltips get AppliesNextMap appended automatically.

KeyboardLayout=키보드 배열
KeyboardLayoutTooltip=키에 인쇄된 글자입니다.
KeyboardType=키보드 종류
KeyboardTypeTooltip=키보드의 모양: 납작한 Enter(ANSI) 또는 Z 왼쪽에 키가 하나 더 있는 세로로 긴 Enter(ISO).
TypeAnsi=ANSI (미국) - 납작한 Enter
TypeIso=ISO (유럽) - 세로로 긴 Enter
HighlightHomeRow=기본 자리 강조
HighlightHomeRowTooltip=손가락을 올려두는 여덟 개의 키를 더 밝은 색으로 표시해 한눈에 찾을 수 있게 합니다. 두 검지 키에는 돌기가 항상 표시됩니다.
ScreenCentre=화면 중앙
ScreenCentreTooltip=키보드의 어느 부분을 화면 정중앙에 둘지 정합니다.
