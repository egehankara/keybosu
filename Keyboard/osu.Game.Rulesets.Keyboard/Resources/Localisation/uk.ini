KeyboardLayout = Розкладка клавіатури
KeyboardLayoutTooltip = Що надруковано на клавішах.
KeyboardType = Тип клавіатури
KeyboardTypeTooltip = Форма вашої клавіатури: плаский Enter (ANSI) або високий Enter з додатковою клавішею зліва внизу (ISO).
TypeAnsi = ANSI (США) — плаский Enter
TypeIso = ISO (Європа) — високий Enter
HighlightHomeRow = Підсвічувати основний ряд
HighlightHomeRowTooltip = Показує світлішими вісім клавіш, на яких лежать пальці, щоб знайти їх одним поглядом. На двох клавішах вказівних пальців мітки видно завжди.
ScreenCentre = Центр екрана
ScreenCentreTooltip = Яка частина клавіатури розташована точно в центрі екрана.
CentreWholeKeyboard = Уся клавіатура
CentreSpaceBar = Пробіл
CentreBetweenIndexFingers = Між вказівними пальцями
ShowJudgements = Показувати оцінки влучань
ShowJudgementsTooltip = Показує Great, Ok, Meh і Miss дрібно під літерою натиснутої клавіші, графікою вашого скіна.
ShowFollowPoints = Показувати follow points
ShowFollowPointsTooltip = Показує точки, що ведуть від кожної ноти до наступної, як в osu!. Вони залежать від твого скіна.
AppliesNextMap = Застосовується з наступної карти.
KeySpace = Пробіл
HoldSpace = Тримайте пробіл!
KeyBindingsHint = Будь ласка, не змінюйте ці призначення без потреби. Якщо клавіатура не підходить, виберіть її в налаштуваннях keybosu!.
ModOriginalDensityDescription = Усі ноти карти, на всіх клавішах, зі своїм approach rate.
ModEasyDescription = Ширші вікна таймінгу, квадрати, що заповнюються повільніше, м'якша втрата здоров'я і додаткові життя!
ModHiddenDescription = Ноти зникають, поки їхній квадрат ще не заповнений: натискай їх з пам'яті.
ModMirrorDescription = Віддзеркалює карту зліва направо: ноти з лівого боку потрапляють на правий бік клавіатури.
ModLeftHandDescription = Усі ноти потрапляють на ліву половину клавіатури, лише для лівої руки.
ModRightHandDescription = Усі ноти потрапляють на праву половину клавіатури, лише для правої руки.
ModHomeRowDescription = Усі ноти потрапляють на основний ряд: вісім клавіш, на яких лежать пальці.
Feedback = Відгуки та повідомлення про помилки на GitHub
