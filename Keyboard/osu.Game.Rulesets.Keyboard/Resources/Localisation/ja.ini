# English source texts for keybosu!. Every other <language>.ini in this folder translates these keys.=
# Translations are managed on Crowdin; edit only this file by hand, the others come back from Crowdin.=
# Tooltips get AppliesNextMap appended automatically.=

KeyboardLayout=キーボード配列
KeyboardLayoutTooltip=キーに印字されている文字。
KeyboardType=キーボードの種類
KeyboardTypeTooltip=キーボードの形状：横長のEnter（ANSI）か、Zの左に追加キーがある縦長のEnter（ISO）。
TypeAnsi=ANSI（US）- 横長Enter
TypeIso=ISO（欧州）- 縦長Enter
HighlightHomeRow=ホームポジションを強調
HighlightHomeRowTooltip=指を置く8つのキーを明るい色で表示し、ひと目で見つけられるようにします。人差し指の2つのキーには常に突起が表示されます。
ScreenCentre=画面の中心
ScreenCentreTooltip=キーボードのどの部分を画面の真ん中に置くか。
CentreWholeKeyboard=キーボード全体
CentreSpaceBar=スペースキー
CentreBetweenIndexFingers=人差し指の間
ShowJudgements=判定を表示
ShowJudgementsTooltip=押したキーの文字の下に Great、Ok、Meh、Miss を小さく表示します。スキンの判定画像を使います。
AppliesNextMap=次の譜面の開始時に適用されます。
KeySpace=スペース
HoldSpace=スペースを長押し！
KeyBindingsHint=必要な場合を除き、これらの割り当ては変更しないでください。キーボードが合わない場合は、keybosu! の設定で選択できます。
Feedback=GitHub でフィードバック・不具合報告

